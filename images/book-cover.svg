 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#102b45"/><stop offset=".36" stop-color="#52677b"/><stop offset=".62" stop-color="#d18b67"/><stop offset=".79" stop-color="#f2bd83"/><stop offset="1" stop-color="#6d6554"/></linearGradient>
